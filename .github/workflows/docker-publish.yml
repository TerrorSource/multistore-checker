name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Vangt een kapotte release af vóór er een image naar GHCR gaat:
  # syntax-check van alle modules + een smoke-test van de draaiende server.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for f in server.js stores.js watcher.js gratis.js datadir.js storage.js; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test

      - name: Smoke test
        run: |
          mkdir -p /tmp/mc-data
          CONFIG_DIR=/tmp/mc-data PORT=8000 node server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/api/status > /tmp/status.json; then break; fi
            sleep 1
          done
          cat /tmp/status.json
          node -e "const s=require('/tmp/status.json'); const v=require('./package.json').version; if (s.version!==v) { console.error('versie mismatch', s.version, v); process.exit(1); }"
          test -f /tmp/mc-data/config.json
          kill %1 || true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
