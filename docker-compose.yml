services:
  multistore-checker:
    build: .
    container_name: multistore-checker
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Europe/Amsterdam
      - PORT=3000
      # Optioneel: stel standaard waarden in via environment variables
      # Deze worden gebruikt als er nog geen config.json bestaat
      # - TELEGRAM_BOT_TOKEN=jouw_bot_token
      # - TELEGRAM_CHAT_ID=jouw_chat_id
      # - CHECK_INTERVAL=360
