<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multistore Checker — Zoeken</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-kv">multistore</span><span class="brand-pw">Checker</span></div>
      <nav class="topnav">
        <a href="/">Zoeken</a>
        <a href="/gevolgd">Gevolgde producten</a>
        <a href="/instellingen">Instellingen</a>
      </nav>
    </div>
  </div>

  <div class="container">
    <div class="warning-banner" id="telegramWarning" hidden></div>
    <div class="status-bar">
      <div class="status-card">
        <div class="label">Aanbiedingen-checker</div>
        <div class="value" id="statusActive">Laden...</div>
      </div>
      <div class="status-card">
        <div class="label">Gratis-checker</div>
        <div class="value" id="statusGratis">-</div>
      </div>
      <div class="status-card">
        <div class="label">Gevolgd</div>
        <div class="value" id="statusWatching">-</div>
      </div>
      <div class="status-card">
        <div class="label">In de aanbieding</div>
        <div class="value deals" id="statusDeals">-</div>
      </div>
      <div class="status-card">
        <div class="label">Laatste check</div>
        <div class="value" id="statusLastCheck" style="font-size:14px">-</div>
      </div>
    </div>
    <div class="site-health" id="siteHealth" hidden></div>

    <div class="card">
      <h2>Product zoeken</h2>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Zoek op naam of productcode, bv. 'creatine' of 1300552" autocomplete="off">
        <select id="searchSite">
          <option value="nl">Kruidvat NL</option>
          <option value="be">Kruidvat BE</option>
          <option value="tp">Trekpleister</option>
          <option value="ici">ICI PARIS XL</option>
        </select>
        <button class="btn btn-primary" id="btnSearch">Zoeken</button>
      </div>
      <div class="filter-row">
        <input type="checkbox" id="showOutOfStock">
        <label for="showOutOfStock">Toon ook producten die niet op voorraad zijn</label>
      </div>
      <div class="chip-row" id="categoryChips">
        <span class="chip-label">Soort actie:</span>
      </div>
      <div class="filter-row price-row">
        <span class="chip-label">Prijs:</span>
        <span class="price-field"><label for="priceMin">van €</label>
        <input type="text" inputmode="decimal" id="priceMin" placeholder="min" autocomplete="off"></span>
        <span class="price-field"><label for="priceMax">tot €</label>
        <input type="text" inputmode="decimal" id="priceMax" placeholder="max" autocomplete="off"></span>
        <span class="price-field"><label for="searchSort">Sorteren:</label>
        <select id="searchSort">
          <option value="relevance">Relevantie</option>
          <option value="price-asc">Prijs oplopend</option>
          <option value="price-desc">Prijs aflopend</option>
        </select></span>
      </div>
      <div class="filter-row price-row">
        <span class="price-field"><label for="brandFilter">Merk:</label>
        <select id="brandFilter" class="facet-select" disabled><option value="">Alle merken</option></select></span>
        <span class="price-field"><label for="promoFilter">Actie van de winkel:</label>
        <select id="promoFilter" class="facet-select" disabled><option value="">Alle acties</option></select></span>
        <button type="button" class="btn btn-small btn-secondary" id="btnPriceReset" hidden>Filters wissen</button>
      </div>
      <div class="result-summary" id="resultSummary" hidden></div>
      <div class="product-list" id="searchResults"></div>
    </div>

    <footer class="app-footer">multistore-checker <span id="appVersion">v…</span><span id="chromeNotice"></span><span id="updateNotice"></span></footer>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/app.js"></script>
  <script>
    let watchlistItems = [];
    const NO_FACETS = { brands: [], promos: [] };
    let lastSearch = { site: 'nl', term: '', products: [], nextStart: 0, total: 0, hasMore: false, sort: 'relevance', priceMin: null, priceMax: null, inStock: false, brand: null, promo: null, facets: NO_FACETS };

    // Het laatste zoekresultaat blijft bewaard in de sessie van dit tabblad,
    // zodat het er nog staat na een uitstapje naar "Gevolgde producten" of
    // "Instellingen". sessionStorage kan ontbreken of vol zijn (privévenster,
    // geblokkeerde opslag): dan werkt alles gewoon zonder bewaren.
    const SEARCH_KEY = 'mc.lastSearch';
    function saveSearchState() {
      try {
        sessionStorage.setItem(SEARCH_KEY, JSON.stringify({
          ...lastSearch,
          categories: [...activeCategories],
          showOutOfStock: document.getElementById('showOutOfStock').checked,
          priceMinInput: document.getElementById('priceMin').value,
          priceMaxInput: document.getElementById('priceMax').value,
          sortInput: document.getElementById('searchSort').value
        }));
      } catch { /* bewaren is een gemak, geen vereiste */ }
    }
    function restoreSearchState() {
      let st = null;
      try { st = JSON.parse(sessionStorage.getItem(SEARCH_KEY) || 'null'); } catch { st = null; }
      if (!st || !Array.isArray(st.products) || !st.term) return;
      lastSearch = {
        site: st.site || 'nl', term: st.term, products: st.products,
        nextStart: st.nextStart || st.products.length, total: st.total || st.products.length, hasMore: Boolean(st.hasMore),
        sort: st.sort || 'relevance',
        // Sessies van 2.10.0 bewaarden hier de tekst uit de invoervelden.
        priceMin: typeof st.priceMin === 'number' ? st.priceMin : null,
        priceMax: typeof st.priceMax === 'number' ? st.priceMax : null,
        // Nieuw in 2.12.0; een sessie van daarvoor heeft deze velden niet.
        inStock: Boolean(st.inStock),
        brand: typeof st.brand === 'string' && st.brand ? st.brand : null,
        promo: typeof st.promo === 'string' && st.promo ? st.promo : null,
        facets: (st.facets && Array.isArray(st.facets.brands) && Array.isArray(st.facets.promos)) ? st.facets : NO_FACETS
      };
      document.getElementById('searchInput').value = st.term;
      const sel = document.getElementById('searchSite');
      if ([...sel.options].some(o => o.value === lastSearch.site)) sel.value = lastSearch.site;
      document.getElementById('showOutOfStock').checked = Boolean(st.showOutOfStock);
      document.getElementById('priceMin').value = st.priceMinInput || '';
      document.getElementById('priceMax').value = st.priceMaxInput || '';
      const sortSel = document.getElementById('searchSort');
      if ([...sortSel.options].some(o => o.value === st.sortInput)) sortSel.value = st.sortInput;
      (st.categories || []).forEach(c => { if (PROMO_CATEGORIES[c]) activeCategories.add(c); });
    }

    // Actie-categorieën (zelfde sleutels als de server meegeeft in
    // promoCategory). Geen chip actief = geen categoriefilter.
    const PROMO_CATEGORIES = {
      'xy-gratis': '1+1 / X+Y gratis',
      '2e-halve-prijs': '2e halve prijs',
      'korting': '% korting',
      'afgeprijsd': 'Afgeprijsd',
      'overig': 'Overige acties'
    };
    const activeCategories = new Set();

    function renderCategoryChips() {
      const row = document.getElementById('categoryChips');
      row.querySelectorAll('.chip').forEach(el => el.remove());
      for (const [key, label] of Object.entries(PROMO_CATEGORIES)) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (activeCategories.has(key) ? ' active' : '');
        chip.textContent = label;
        chip.addEventListener('click', () => {
          if (activeCategories.has(key)) activeCategories.delete(key);
          else activeCategories.add(key);
          renderCategoryChips();
          renderSearchResults();
          saveSearchState();
        });
        row.appendChild(chip);
      }
    }

    // Prijsgrens uit een invoerveld: komma of punt als decimaalteken, leeg =
    // geen grens. Een ongeldige waarde markeert het veld en telt niet mee.
    function readPrice(id) {
      const el = document.getElementById(id);
      const raw = el.value.trim().replace(/^€\s*/, '').replace(',', '.');
      if (raw === '') { el.classList.remove('invalid'); return null; }
      const v = Number(raw);
      const ok = Number.isFinite(v) && v >= 0;
      el.classList.toggle('invalid', !ok);
      return ok ? v : null;
    }
    function priceBounds() {
      let min = readPrice('priceMin');
      let max = readPrice('priceMax');
      if (min != null && max != null && min > max) [min, max] = [max, min];
      return { min, max, active: min != null || max != null };
    }

    // Merk- en actiekeuzelijst: gevuld met wat de winkel bij deze zoekopdracht
    // aanbiedt (met aantallen). Een gekozen waarde die de winkel niet meer
    // teruggeeft (bv. bij 0 resultaten) blijft als keuze staan, zodat je hem
    // nog kunt wissen.
    function renderFacetSelect(id, values, selected, allLabel) {
      const sel = document.getElementById(id);
      const list = [...values].sort((a, b) => a.name.localeCompare(b.name, 'nl', { sensitivity: 'base' }));
      if (selected && !list.some(v => v.code === selected)) list.unshift({ code: selected, name: selected, count: null });
      sel.innerHTML = `<option value="">${esc(allLabel)}${values.length ? ` (${values.length})` : ''}</option>`
        + list.map(v => `<option value="${esc(v.code)}">${esc(v.name)}${v.count != null ? ` (${v.count})` : ''}</option>`).join('');
      sel.value = selected || '';
      sel.disabled = list.length === 0;
    }
    function renderFacets() {
      const f = lastSearch.facets || NO_FACETS;
      renderFacetSelect('brandFilter', f.brands, lastSearch.brand, 'Alle merken');
      renderFacetSelect('promoFilter', f.promos, lastSearch.promo, 'Alle acties');
    }
    function facetName(list, code) {
      const hit = (list || []).find(v => v.code === code);
      return hit ? hit.name : code;
    }
    function filtersActive() {
      return priceBounds().active || Boolean(document.getElementById('brandFilter').value) || Boolean(document.getElementById('promoFilter').value);
    }

    function isWatched(site, code) {
      return watchlistItems.some(i => i.site === site && i.code === code);
    }

    function visibleProducts() {
      const showOOS = document.getElementById('showOutOfStock').checked;
      return lastSearch.products.filter(p => {
        // Prijs, sortering, voorraad, merk en actie zijn al bij de winkel
        // toegepast (zie doSearch). De voorraadcontrole hier is een vangnet
        // voor wat de winkel anders rekent (bv. niet meer te koop, wel
        // voorraad) en voor resultaten uit een oudere sessie.
        // inStock: true = op voorraad, false = niet, null = onbekend.
        // Onbekend tonen we altijd; 'niet op voorraad' alleen met het vinkje aan.
        if (!showOOS && p.inStock === false) return false;
        // Categoriefilter: alleen actief zodra minstens één chip aan staat.
        if (activeCategories.size > 0 && !activeCategories.has(p.promoCategory)) return false;
        return true;
      });
    }

    // Regel boven de resultaten: hoeveel de winkel er vond, hoeveel er geladen
    // zijn en hoeveel er na de filters overblijven.
    function renderSummary(visibleCount) {
      const el = document.getElementById('resultSummary');
      const { term, products, total } = lastSearch;
      document.getElementById('btnPriceReset').hidden = !filtersActive();
      if (!term) { el.hidden = true; return; }
      el.hidden = false;
      const n = (x) => x.toLocaleString('nl-NL');
      const facets = lastSearch.facets || NO_FACETS;
      // Wat de winkel al gefilterd heeft, in woorden.
      const applied = [];
      if (lastSearch.brand) applied.push(`merk <b>${esc(facetName(facets.brands, lastSearch.brand))}</b>`);
      if (lastSearch.promo) applied.push(`actie <b>${esc(facetName(facets.promos, lastSearch.promo))}</b>`);
      if (lastSearch.inStock) applied.push('alleen op voorraad');
      if (products.length === 0) {
        const narrowed = applied.length > 0 || lastSearch.priceMin != null || lastSearch.priceMax != null;
        let html = `Geen resultaten gevonden voor <b>${esc(term)}</b>${narrowed ? ' met deze filters' : ''}.`;
        if (lastSearch.inStock) html += '<span class="summary-hint">Producten die niet op voorraad zijn, zijn niet meegezocht; zet het vinkje hierboven aan om ze ook te zien.</span>';
        el.innerHTML = html;
        return;
      }
      const found = Math.max(total || 0, products.length);
      const eur = (v) => '€ ' + Number(v).toFixed(2).replace('.', ',');
      let range = '';
      if (lastSearch.priceMin != null && lastSearch.priceMax != null) range = ` tussen ${eur(lastSearch.priceMin)} en ${eur(lastSearch.priceMax)}`;
      else if (lastSearch.priceMin != null) range = ` vanaf ${eur(lastSearch.priceMin)}`;
      else if (lastSearch.priceMax != null) range = ` tot ${eur(lastSearch.priceMax)}`;
      const parts = [`<b>${n(found)}</b> ${found === 1 ? 'resultaat' : 'resultaten'} gevonden voor <b>${esc(term)}</b>${range}`];
      const SORT_LABEL = { 'price-asc': 'prijs oplopend', 'price-desc': 'prijs aflopend' };
      parts.push(...applied);
      if (SORT_LABEL[lastSearch.sort]) parts.push(`gesorteerd op ${SORT_LABEL[lastSearch.sort]}`);
      if (products.length < found) parts.push(`${n(products.length)} geladen`);
      if (visibleCount !== products.length) parts.push(`<b>${n(visibleCount)}</b> getoond na filters`);
      let html = parts.join(' · ');
      // Alleen het filter op soort actie werkt nog op de geladen producten;
      // de rest past de winkel al toe op het hele resultaat.
      if (visibleCount !== products.length && lastSearch.hasMore) {
        html += '<span class="summary-hint">Het filter op soort actie geldt voor de geladen resultaten; laad meer voor de rest.</span>';
      }
      el.innerHTML = html;
    }

    function renderSearchResults() {
      const c = document.getElementById('searchResults');
      const { site } = lastSearch;
      const products = visibleProducts();
      const hidden = lastSearch.products.length - products.length;
      renderSummary(products.length);

      if (lastSearch.products.length === 0) {
        c.innerHTML = '';
        return;
      }
      const rows = products.map(p => {
        const promoBadge = p.promo
          ? `<span class="badge promo">${esc(p.promo.headline)}</span>` : '';
        const stockBadge = p.inStock === false
          ? `<span class="badge nostock">niet op voorraad</span>` : '';
        const watched = isWatched(site, p.code);
        return `<div class="product-row">
          ${productImageHtml(p)}
          <div class="product-info">
            <div class="pname"><a href="${esc(p.url || '#')}" target="_blank" rel="noopener">${esc(p.name)}</a></div>
            <div class="pmeta">
              ${priceHtml(p.priceFormatted, p.oldPriceFormatted)}
              ${promoBadge} ${stockBadge}
              <span>code ${esc(p.code)}</span>
            </div>
          </div>
          <div class="product-actions">
            <button class="btn btn-small ${watched ? 'btn-secondary' : 'btn-primary'}"
              data-code="${esc(p.code)}" ${watched ? 'disabled' : ''}>
              ${watched ? '✓ Gevolgd' : '+ Volgen'}
            </button>
          </div>
        </div>`;
      });

      if (products.length === 0) {
        rows.push(`<div class="empty-note">Alle ${hidden} geladen producten vallen buiten het filter op soort actie${document.getElementById('showOutOfStock').checked ? '' : ' of zijn niet op voorraad'}. Pas de filters aan om ze te tonen.</div>`);
      }
      // Volgende pagina ophalen zolang de winkel meer resultaten heeft.
      const shown = lastSearch.products.length;
      if (lastSearch.hasMore) {
        rows.push(`<div class="btn-row more-row"><button class="btn btn-secondary" id="btnMore">Meer laden (${shown} van ${lastSearch.total})</button></div>`);
      }
      c.innerHTML = rows.join('');

      c.querySelectorAll('button[data-code]').forEach(btn => {
        btn.addEventListener('click', () => addToWatchlist(site, btn.dataset.code, btn));
      });
      const more = document.getElementById('btnMore');
      if (more) more.addEventListener('click', loadMore);
    }

    // Elk verzoek levert tot 100 resultaten vanaf 'start'.
    async function fetchResults(site, term, start, opts) {
      const q = new URLSearchParams({ site, q: term, start: String(start), sort: opts.sort || 'relevance' });
      if (opts.priceMin != null) q.set('min', String(opts.priceMin));
      if (opts.priceMax != null) q.set('max', String(opts.priceMax));
      if (opts.inStock) q.set('stock', '1');
      if (opts.brand) q.set('brand', opts.brand);
      if (opts.promo) q.set('promo', opts.promo);
      const res = await fetch('/api/search?' + q);
      return res.json();
    }

    function currentOptions() {
      const { min, max } = priceBounds();
      return {
        sort: document.getElementById('searchSort').value, priceMin: min, priceMax: max,
        // Vinkje uit = alleen op voorraad, en dat filtert de winkel zelf.
        inStock: !document.getElementById('showOutOfStock').checked,
        brand: document.getElementById('brandFilter').value || null,
        promo: document.getElementById('promoFilter').value || null
      };
    }

    // Elke zoekopdracht krijgt een volgnummer; een antwoord op een oudere
    // opdracht (bv. terwijl je nog aan het typen was) wordt genegeerd.
    let searchSeq = 0;

    async function doSearch() {
      const term = document.getElementById('searchInput').value.trim();
      const site = document.getElementById('searchSite').value;
      if (!term) return;
      // Ongeldige prijsinvoer: niet zoeken, het veld is al rood gemarkeerd.
      if (document.querySelector('.price-row input.invalid')) return;
      // Andere zoekterm of winkel: merk en actie horen bij de vorige
      // zoekopdracht en vervallen (prijs, sortering en voorraad blijven).
      if (term !== lastSearch.term || site !== lastSearch.site) {
        document.getElementById('brandFilter').value = '';
        document.getElementById('promoFilter').value = '';
      }
      const opts = currentOptions();
      const mySeq = ++searchSeq;
      const btn = document.getElementById('btnSearch');
      btn.disabled = true;
      // Tot 100 resultaten = meerdere pagina's bij de winkel: dat duurt even.
      btn.textContent = 'Zoeken… (tot 100 resultaten)';
      try {
        const data = await fetchResults(site, term, 0, opts);
        if (mySeq !== searchSeq) return;
        if (data.success) {
          lastSearch = {
            site, term, products: data.products, nextStart: data.nextStart || data.products.length,
            total: data.total || data.products.length, hasMore: Boolean(data.hasMore),
            sort: data.sort || opts.sort, priceMin: data.priceMin ?? opts.priceMin, priceMax: data.priceMax ?? opts.priceMax,
            inStock: Boolean(data.inStock ?? opts.inStock), brand: data.brand ?? opts.brand, promo: data.promo ?? opts.promo,
            facets: data.facets || NO_FACETS
          };
          renderFacets();
          renderSearchResults();
          saveSearchState();
          if (data.products.length === 0) showToast('Geen producten gevonden', 'info');
        } else {
          showToast('Zoeken mislukt: ' + (data.error || 'onbekende fout'), 'error');
        }
      } catch (err) {
        if (mySeq === searchSeq) showToast('Zoeken mislukt: server niet bereikbaar', 'error');
      } finally {
        if (mySeq === searchSeq) {
          btn.disabled = false;
          btn.textContent = 'Zoeken';
        }
        loadStatus();
      }
    }

    // Prijs, sortering, voorraad, merk of actie gewijzigd: opnieuw zoeken
    // (alleen als er al een zoekterm is). Bij typen in een prijsveld even
    // wachten tot je klaar bent.
    let refineTimer = null;
    function refineSearch(delayMs) {
      clearTimeout(refineTimer);
      renderSummary(visibleProducts().length);
      saveSearchState();
      if (!document.getElementById('searchInput').value.trim()) return;
      refineTimer = setTimeout(doSearch, delayMs);
    }

    async function loadMore() {
      const btn = document.getElementById('btnMore');
      if (btn) { btn.disabled = true; btn.textContent = 'Volgende 100 laden…'; }
      try {
        const data = await fetchResults(lastSearch.site, lastSearch.term, lastSearch.nextStart, lastSearch);
        if (data.success) {
          // Dubbele codes (kan bij verschuivende sortering) overslaan.
          const seen = new Set(lastSearch.products.map(p => p.code));
          const nieuw = data.products.filter(p => !seen.has(p.code));
          lastSearch.products = lastSearch.products.concat(nieuw);
          lastSearch.nextStart = data.nextStart || lastSearch.nextStart;
          lastSearch.total = data.total || lastSearch.total;
          lastSearch.hasMore = Boolean(data.hasMore) && nieuw.length > 0;
          renderSearchResults();
          saveSearchState();
        } else {
          showToast('Meer laden mislukt: ' + (data.error || 'onbekende fout'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = 'Meer laden'; }
        }
      } catch (err) {
        showToast('Meer laden mislukt: server niet bereikbaar', 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Meer laden'; }
      }
    }

    async function addToWatchlist(site, code, btn) {
      const p = lastSearch.products.find(x => x.code === code);
      if (!p) return;
      if (btn) { btn.disabled = true; btn.textContent = 'Bezig...'; }
      try {
        const res = await fetch('/api/watchlist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ site, code: p.code, name: p.name, url: p.url, image: p.image })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`"${p.name}" wordt nu gevolgd`, 'success');
          await loadWatchlist();
          renderSearchResults();
          loadStatus();
        } else {
          showToast('Toevoegen mislukt: ' + (data.error || 'onbekende fout'), 'error');
          if (btn) { btn.disabled = false; btn.textContent = '+ Volgen'; }
        }
      } catch (err) {
        showToast('Toevoegen mislukt: server niet bereikbaar', 'error');
        if (btn) { btn.disabled = false; btn.textContent = '+ Volgen'; }
      }
    }

    async function loadWatchlist() {
      try {
        const res = await fetch('/api/watchlist');
        const data = await res.json();
        watchlistItems = data.watchlist || [];
      } catch { /* stil */ }
    }

    let serverDown = false;
    async function loadStatus() {
      let s;
      try {
        const res = await fetch('/api/status');
        s = await res.json();
      } catch (err) {
        if (!serverDown) showToast('Server niet bereikbaar', 'error');
        serverDown = true;
        const activeEl = document.getElementById('statusActive');
        activeEl.textContent = 'Offline';
        activeEl.className = 'value inactive';
        return;
      }
      if (serverDown) {
        serverDown = false;
        showToast('Verbinding hersteld', 'success');
      }
      applyStatus(s);
      const activeEl = document.getElementById('statusActive');
      activeEl.textContent = s.active ? 'Actief' : 'Inactief';
      activeEl.className = 'value ' + (s.active ? 'active' : 'inactive');
      const gratisEl = document.getElementById('statusGratis');
      const gOn = Boolean(s.gratis && s.gratis.active);
      gratisEl.textContent = (s.gratis && s.gratis.checkRunning) ? 'Bezig...' : (gOn ? 'Actief' : 'Inactief');
      gratisEl.className = 'value ' + (gOn ? 'active' : 'inactive');
      document.getElementById('statusWatching').textContent = s.watching;
      document.getElementById('statusDeals').textContent = s.deals;
      document.getElementById('statusLastCheck').textContent =
        s.checkRunning ? 'Bezig...' : formatTime(s.lastCheck);
    }

    document.getElementById('btnSearch').addEventListener('click', doSearch);
    document.getElementById('searchInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
    document.getElementById('showOutOfStock').addEventListener('change', () => { renderSearchResults(); refineSearch(0); });
    document.getElementById('brandFilter').addEventListener('change', () => refineSearch(0));
    document.getElementById('promoFilter').addEventListener('change', () => refineSearch(0));
    for (const id of ['priceMin', 'priceMax']) {
      document.getElementById(id).addEventListener('input', () => refineSearch(800));
      document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') refineSearch(0); });
    }
    document.getElementById('searchSort').addEventListener('change', () => refineSearch(0));
    document.getElementById('btnPriceReset').addEventListener('click', () => {
      document.getElementById('priceMin').value = '';
      document.getElementById('priceMax').value = '';
      document.getElementById('brandFilter').value = '';
      document.getElementById('promoFilter').value = '';
      refineSearch(0);
    });

    restoreSearchState();
    renderFacets();
    renderCategoryChips();
    renderSearchResults();
    // Watchlist laden en daarna opnieuw renderen, zodat bewaarde resultaten
    // meteen de juiste "✓ Gevolgd"-status tonen.
    loadWatchlist().then(renderSearchResults);
    loadStatus();
    setInterval(loadStatus, 15000);
  </script>
</body>
</html>
