<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multistore Checker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .app-footer { text-align: center; color: #9aa2b0; font-size: 12px; margin-top: 24px; }
    header {
      text-align: center;
      padding: 30px 0 20px;
    }
    header h1 { font-size: 24px; color: #e94560; }
    header p { color: #888; font-size: 14px; margin-top: 4px; }

    .status-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .status-card {
      flex: 1;
      min-width: 140px;
      background: #16213e;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .status-card .label { font-size: 12px; color: #888; text-transform: uppercase; }
    .status-card .value { font-size: 20px; font-weight: bold; margin-top: 4px; }
    .status-card .value.active { color: #4ecca3; }
    .status-card .value.inactive { color: #e94560; }

    .card {
      background: #16213e;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 16px;
      color: #e94560;
      margin-bottom: 14px;
      border-bottom: 1px solid #233;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 4px;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: #0f3460;
      border: 1px solid #233;
      border-radius: 6px;
      color: #eee;
      font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #e94560;
    }

    .checkbox-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: #ccc;
      cursor: pointer;
    }
    .checkbox-group input[type="checkbox"] {
      accent-color: #e94560;
      width: 16px;
      height: 16px;
    }

    .switch-container {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .switch {
      position: relative;
      width: 50px;
      height: 26px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #333;
      border-radius: 26px;
      transition: 0.3s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background: #eee;
      border-radius: 50%;
      transition: 0.3s;
    }
    .switch input:checked + .slider { background: #4ecca3; }
    .switch input:checked + .slider:before { transform: translateX(24px); }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #e94560; color: #fff; }
    .btn-secondary { background: #0f3460; color: #eee; border: 1px solid #444; }
    .btn-success { background: #4ecca3; color: #1a1a2e; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      color: #fff;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #4ecca3; color: #1a1a2e; }
    .toast.error { background: #e94560; }
    .toast.info { background: #0f3460; }

    .log-container {
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
    }
    .log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
    .log-time { color: #666; }
    .log-msg { color: #ccc; }

    .results-grid {
      display: grid;
      gap: 8px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #0f3460;
      border-radius: 6px;
    }
    .result-item .site-name { font-weight: 600; }
    .result-item .count {
      background: #e94560;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
    }
    .result-item .count.zero { background: #4ecca3; color: #1a1a2e; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Multistore Checker</h1>
      <p>Docker Edition &mdash; Gemaakt door Makooy</p>
    </header>

    <div class="status-bar">
      <div class="status-card">
        <div class="label">Status</div>
        <div class="value" id="statusActive">Laden...</div>
      </div>
      <div class="status-card">
        <div class="label">Laatste check</div>
        <div class="value" id="statusLastCheck" style="font-size:14px">-</div>
      </div>
      <div class="status-card">
        <div class="label">Bezig</div>
        <div class="value" id="statusRunning">-</div>
      </div>
    </div>

    <!-- Laatste resultaten -->
    <div class="card" id="resultsCard" style="display:none">
      <h2>Laatste resultaten</h2>
      <div class="results-grid" id="resultsGrid"></div>
    </div>

    <!-- Telegram instellingen -->
    <div class="card">
      <h2>Telegram instellingen</h2>
      <div class="form-group">
        <label>Bot Token</label>
        <input type="text" id="botId" placeholder="123456:ABC-DEF...">
      </div>
      <div class="form-group">
        <label>Chat ID</label>
        <input type="text" id="chatId" placeholder="-1001234567890">
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btnTestTelegram">Test Telegram</button>
      </div>
    </div>

    <!-- Scan instellingen -->
    <div class="card">
      <h2>Scan instellingen</h2>
      <div class="switch-container">
        <label class="switch">
          <input type="checkbox" id="active">
          <span class="slider"></span>
        </label>
        <span>Automatisch checken</span>
      </div>
      <div class="form-group">
        <label>Check-interval (minuten)</label>
        <input type="number" id="interval" min="1" value="360" style="max-width:150px">
      </div>
      <div class="form-group">
        <label>Alleen producten op voorraad</label>
        <select id="onlyInStock">
          <option value="true">Ja (alleen op voorraad; Trekpleister altijd)</option>
          <option value="false">Nee (alle producten)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Bericht bij 0 producten</label>
        <select id="notifyEmpty">
          <option value="false">Nee (alleen melden als er producten zijn)</option>
          <option value="true">Ja (altijd een bericht sturen)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Sites</label>
        <div class="checkbox-group">
          <label><input type="checkbox" id="site-nl" value="nl"> Kruidvat NL</label>
          <label><input type="checkbox" id="site-be" value="be"> Kruidvat BE</label>
          <label><input type="checkbox" id="site-tp" value="tp"> Trekpleister NL</label>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnSave">Opslaan</button>
        <button class="btn btn-success" id="btnCheckNow">Controleer nu</button>
      </div>
    </div>

    <!-- Logs -->
    <div class="card">
      <h2>Logs</h2>
      <div class="log-container" id="logContainer">
        <div class="log-entry"><span class="log-msg">Laden...</span></div>
      </div>
    </div>
    <footer class="app-footer">multistore-checker <span id="appVersion">v…</span></footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + type;
      setTimeout(() => t.className = 'toast', 3000);
    }

    function formatTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return d.toLocaleString('nl-NL', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' });
    }

    async function loadConfig() {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      document.getElementById('botId').value = cfg.botId || '';
      document.getElementById('chatId').value = cfg.chatId || '';
      document.getElementById('active').checked = cfg.active;
      document.getElementById('interval').value = cfg.interval;
      document.getElementById('onlyInStock').value = String(cfg.onlyInStock);
      document.getElementById('notifyEmpty').value = String(cfg.notifyEmpty || false);
      document.getElementById('site-nl').checked = cfg.sitesEnabled.includes('nl');
      document.getElementById('site-be').checked = cfg.sitesEnabled.includes('be');
      document.getElementById('site-tp').checked = cfg.sitesEnabled.includes('tp');
    }

    async function loadStatus() {
      const res = await fetch('/api/status');
      const s = await res.json();
      if (s.version) document.getElementById('appVersion').textContent = 'v' + s.version;
      const activeEl = document.getElementById('statusActive');
      activeEl.textContent = s.active ? 'Actief' : 'Inactief';
      activeEl.className = 'value ' + (s.active ? 'active' : 'inactive');
      document.getElementById('statusLastCheck').textContent = formatTime(s.lastCheck);
      document.getElementById('statusRunning').textContent = s.checkRunning ? 'Ja...' : 'Nee';

      if (s.lastResults.length > 0) {
        document.getElementById('resultsCard').style.display = 'block';
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = s.lastResults.map(r =>
          `<div class="result-item">
            <span class="site-name">${r.site}</span>
            <span class="count ${r.found === 0 ? 'zero' : ''}">${r.found} producten</span>
          </div>`
        ).join('');
      }

      // Logs
      const logC = document.getElementById('logContainer');
      logC.innerHTML = s.logs.map(l =>
        `<div class="log-entry"><span class="log-time">${formatTime(l.time)}</span> <span class="log-msg">${l.message}</span></div>`
      ).join('');
    }

    // Save
    document.getElementById('btnSave').addEventListener('click', async () => {
      const sites = [];
      if (document.getElementById('site-nl').checked) sites.push('nl');
      if (document.getElementById('site-be').checked) sites.push('be');
      if (document.getElementById('site-tp').checked) sites.push('tp');

      const body = {
        botId: document.getElementById('botId').value,
        chatId: document.getElementById('chatId').value,
        active: document.getElementById('active').checked,
        interval: parseInt(document.getElementById('interval').value, 10),
        onlyInStock: document.getElementById('onlyInStock').value === 'true',
        notifyEmpty: document.getElementById('notifyEmpty').value === 'true',
        sitesEnabled: sites
      };

      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      showToast('Instellingen opgeslagen!', 'success');
      loadStatus();
    });

    // Check now
    document.getElementById('btnCheckNow').addEventListener('click', async () => {
      const btn = document.getElementById('btnCheckNow');
      btn.disabled = true;
      btn.textContent = 'Bezig...';
      showToast('Handmatige check gestart...', 'info');

      const res = await fetch('/api/check', { method: 'POST' });
      const result = await res.json();

      btn.disabled = false;
      btn.textContent = 'Controleer nu';
      if (result.success) {
        const total = result.results.reduce((s, r) => s + r.afterFilter, 0);
        showToast(`Check voltooid: ${total} producten gevonden`, 'success');
      } else {
        showToast('Check mislukt: ' + (result.error || 'onbekende fout'), 'error');
      }
      loadStatus();
    });

    // Test Telegram
    document.getElementById('btnTestTelegram').addEventListener('click', async () => {
      const res = await fetch('/api/test-telegram', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        showToast('Testbericht verzonden!', 'success');
      } else {
        showToast('Fout: ' + (data.error || 'onbekend'), 'error');
      }
    });

    // Init
    loadConfig();
    loadStatus();
    setInterval(loadStatus, 15000);
  </script>
</body>
</html>
